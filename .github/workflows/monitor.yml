# Save this in your repo as: .github/workflows/monitor.yml
name: Alza MacBook monitor

on:
  schedule:
    # Every 30 minutes, offset off the round marks (the :00/:30 marks are the
    # busiest on GitHub's scheduler, so off-minutes start more punctually).
    # Times are UTC. For hourly instead, use: "17 * * * *"
    - cron: "17,47 * * * *"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

# Required so the job can commit price_history.json / state.json / README.md
permissions:
  contents: write

# If a run is still going when the next fires, don't pile up.
concurrency:
  group: alza-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run price check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        # Exit code 2 means "blocked" — expected sometimes, so don't fail the run.
        run: |
          set +e
          python cloud_runner.py
          code=$?
          echo "runner exit code: $code"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi

      - name: Commit updated data
        run: |
          git config user.name "alza-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price_history.json state.json README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "price check $(date -u +%Y-%m-%dT%H:%MZ)"
            # Another run may have pushed meanwhile; rebase and retry once.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
